<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Rangoli Camera Tracer</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#111;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;overscroll-behavior:none}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background:#1b1b1b}
#cam,#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#photo{display:none}
#ov{position:absolute;left:50%;top:50%;width:78vmin;height:78vmin;margin:-39vmin 0 0 -39vmin;transform-origin:50% 50%;pointer-events:none;will-change:transform}
#ov canvas,#ov img{width:100%;height:100%;display:block;border-radius:6px}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:rgba(0,0,0,.55);z-index:5}
#start h1{margin:0;font-size:22px}
#start p{margin:0;max-width:320px;font-size:14px;opacity:.85;line-height:1.4}
button,label.btn{font:inherit;color:#fff;background:#2b2b2e;border:1px solid #444;border-radius:12px;padding:10px 12px;font-size:14px}
button.primary{background:#d6246e;border-color:#d6246e;font-size:16px;padding:12px 22px}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.8) 35%);display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.row input[type=range]{flex:1;min-width:120px;accent-color:#d6246e}
.on{background:#d6246e!important;border-color:#d6246e!important}
#msg{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;text-align:center;font-size:13px;z-index:7;pointer-events:none}
#msg span{background:rgba(0,0,0,.7);padding:6px 10px;border-radius:10px;display:inline-block}
input[type=file]{display:none}
</style>
</head>
<body>
<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <img id="photo" alt="">
  <div id="ov"><canvas id="cv" width="800" height="800"></canvas></div>
  <div id="start">
    <h1>Rangoli Camera Tracer</h1>
    <p>Point your camera at the floor. The rangoli design will float on top so you can draw it. Drag to move, pinch to resize and rotate.</p>
    <button class="primary" id="go">Start camera</button>
    <label class="btn" for="shot">Or take a photo of the floor</label>
    <p id="err" style="color:#ffb4c8"></p>
  </div>
</div>
<div id="msg"></div>
<div id="bar">
  <div class="row"><span style="font-size:12px">Fade</span><input type="range" id="op" min="10" max="100" value="60"></div>
  <div class="row">
    <button id="mode">Outline: off</button>
    <button id="flip">Flip camera</button>
    <button id="lock">Lock</button>
    <button id="reset">Reset</button>
    <button id="hide">Hide</button>
    <label class="btn" for="own">My image</label>
    <label class="btn" for="shot">Photo</label>
  </div>
</div>
<input type="file" id="own" accept="image/*">
<input type="file" id="shot" accept="image/*" capture="environment">
<script>
(function(){
const $=id=>document.getElementById(id);
const cam=$('cam'),photo=$('photo'),ov=$('ov'),cv=$('cv'),ctx=cv.getContext('2d');
let src=new Image(), outline=false, locked=false, facing='environment', stream=null;
let st={x:0,y:0,s:1,r:0};
function say(t,ms){const m=$('msg');m.innerHTML=t?'<span>'+t+'</span>':'';if(t&&ms)setTimeout(()=>{m.innerHTML=''},ms)}
function apply(){ov.style.transform='translate('+st.x+'px,'+st.y+'px) rotate('+st.r+'rad) scale('+st.s+')'}
function draw(){
  const W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);
  if(!src.naturalWidth)return;
  ctx.drawImage(src,0,0,W,H);
  if(!outline)return;
  const d=ctx.getImageData(0,0,W,H),p=d.data,g=new Float32Array(W*H);
  for(let i=0;i<W*H;i++)g[i]=.3*p[i*4]+.59*p[i*4+1]+.11*p[i*4+2];
  const o=ctx.createImageData(W,H),q=o.data;
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    const i=y*W+x;
    const gx=-g[i-W-1]-2*g[i-1]-g[i+W-1]+g[i-W+1]+2*g[i+1]+g[i+W+1];
    const gy=-g[i-W-1]-2*g[i-W]-g[i-W+1]+g[i+W-1]+2*g[i+W]+g[i+W+1];
    const m=Math.sqrt(gx*gx+gy*gy);
    if(m>70){const k=i*4;q[k]=255;q[k+1]=240;q[k+2]=60;q[k+3]=255}
  }
  ctx.putImageData(o,0,0);
}

function setOp(){ov.style.opacity=$('op').value/100}
$('op').oninput=setOp;setOp();apply();

async function startCam(){
  $('err').textContent='';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    $('err').textContent='Live camera is not available in this view. Open this page directly in your phone browser (Safari/Chrome), or tap "take a photo" instead.';return false}
  try{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false});
    cam.srcObject=stream;await cam.play().catch(()=>{});
    photo.style.display='none';cam.style.display='block';
    $('start').style.display='none';say('Drag = move · pinch = size & rotate',3500);return true;
  }catch(e){
    $('err').textContent='Camera blocked ('+(e.name||'error')+'). Allow camera access, or open this page directly in your phone browser. You can also tap "take a photo" below.';return false}
}
$('go').onclick=startCam;
$('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';startCam()};
function fromFile(f,asPhoto){
  if(!f)return;const u=URL.createObjectURL(f);
  if(asPhoto){photo.src=u;photo.style.display='block';cam.style.display='none';$('start').style.display='none';say('Photo set. Move the design over it.',3000)}
  else setImg(u);
}
$('shot').onchange=e=>fromFile(e.target.files[0],true);
$('own').onchange=e=>{fromFile(e.target.files[0],false);say('Your image loaded',2000)};
$('mode').onclick=()=>{outline=!outline;$('mode').textContent='Outline: '+(outline?'on':'off');$('mode').classList.toggle('on',outline);draw()};
$('lock').onclick=()=>{locked=!locked;$('lock').textContent=locked?'Unlock':'Lock';$('lock').classList.toggle('on',locked);say(locked?'Locked: design will not move':'Unlocked',1800)};
$('reset').onclick=()=>{st={x:0,y:0,s:1,r:0};apply()};
$('hide').onclick=()=>{const h=ov.style.visibility==='hidden';ov.style.visibility=h?'visible':'hidden';$('hide').textContent=h?'Hide':'Show'};

// gestures
const stage=$('stage'),pts=new Map();let g0=null;
function snap(){const a=[...pts.values()];
  if(a.length===1)return{t:1,x:a[0].x,y:a[0].y,st:{...st}};
  if(a.length>=2){const dx=a[1].x-a[0].x,dy=a[1].y-a[0].y;return{t:2,d:Math.hypot(dx,dy)||1,a:Math.atan2(dy,dx),st:{...st}}}
  return null}
stage.addEventListener('pointerdown',e=>{if(locked||e.target.closest('#start'))return;stage.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});g0=snap()});
stage.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)||!g0)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const a=[...pts.values()];
  if(a.length===1&&g0.t===1){st.x=g0.st.x+a[0].x-g0.x;st.y=g0.st.y+a[0].y-g0.y}
  else if(a.length>=2&&g0.t===2){const dx=a[1].x-a[0].x,dy=a[1].y-a[0].y;
    st.s=Math.min(6,Math.max(.2,g0.st.s*Math.hypot(dx,dy)/g0.d));st.r=g0.st.r+(Math.atan2(dy,dx)-g0.a)}
  apply()});
function up(e){pts.delete(e.pointerId);g0=snap()}
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{e.preventDefault();st.s=Math.min(6,Math.max(.2,st.s*(e.deltaY<0?1.06:.94)));apply()},{passive:false});
})();
</script>
